    limitations: Current v4 title differs from the canonical 2024 title. Selected sections only; same-tokenizer
      model families, chosen widths/layers/datasets and filtered feature subsets. Neither tested portability
      of steering/control nor causal identity follows from representational alignment. No complete appendix/figure
      audit or reproduction. The random-model control retains embeddings and custom-SAEs have weaker recovery,
      limiting causal interpretation of differences.
    replication_status: not_performed
    numerical_check: Read text reporting main filtered-retention range 10–30% versus much lower custom-SAE
      retention and approximately1% randomized-control retention. These are source-reported and condition-specific;
      no recomputation or aggregate universality percentage proposed.
    findings:
    - Analogous Feature Universality concerns similarity of spaces spanned by paired SAE decoder features under
      representational transformations, not recovery of atomic true features or identical feature inventories.
    - The method first pairs features by activation correlation on shared-token inputs, then measures decoder-weight-space
      similarity using SVCCA/RSA against randomized pairing/subset baselines. Some middle-layer and semantic
      subsets show stronger alignment than these baselines.
    - 'Appendix D adds a useful alternative-explanation check: trained-versus-randomized Pythia comparisons
      (embedding layer retained) have much lower paired similarity than selected trained-model comparisons.
      This supports learned-structure contribution beyond the simplest data-sparsity explanation, within these
      controls.'
    - Main comparisons retain filtered subsets (non-concept token, shared top-token, correlation and many-to-one
      filters); Appendix B/E show very different retained fractions and recovered similarities across SAE training
      quality. Similarity is therefore conditional on pairing and feature extraction, with substantial unmatched
      or inconsistently recovered representation.
    counterevidence: Positive trained-versus-randomized and shuffled-pairing/subset controls make a blanket
      dismissal as meaningless correlation too strong. Conversely, weaker RSA, unmatched features, filter sensitivity,
      same-tokenizer restrictions and SAE-quality effects support narrower analogous-subspace similarity rather
      than universal causal circuits.
    next_check: Resolve canonical version/title handling; inspect Appendix J/K pairing/filter robustness and
      hold-out matching; demonstrate actual cross-model causal transfer before making a portable-control claim.
