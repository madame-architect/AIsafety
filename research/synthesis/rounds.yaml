    locators:
    - §§3.1–4.3 pp3–5; Figure1 p2
    - §§5–6 pp5–9, Tables1–6 pp6,8
    - §8 p9; AppendixA.3/Table9 pp12–13; Tables10–12 p14
    visual_check: Rendered and inspected p2 method diagram and p6 Tables1–4; p7 Figures3–6 distributions. All
      other table cells, templates, example and captions read in extracted text. No claim of visually checking
      every appendix template or reproducing plots.
    limitations: Llama3-70B-Instruct seed and a specific synthetic-pair construction/filtering recipe; human-written
      WildChat inputs, pretrained/aligned seed and human-reference evaluation remain. No causal isolation of
      all training components or test of universal fairness/independent judgments. No inference-cost evaluation
      or smaller-model demonstration.
    replication_status: not_performed
    numerical_check: Documentary reading of reported tables only. Table9 reports85.5 versus91.1 when the preferred
      response is always first versus last; their average is88.3, consistent with the stated two-order protocol.
      No training or independent benchmark-scoring reproduction; no cross-paper aggregate headline improvement
      is used.
    findings:
    - Iterative synthetic preference/judgment training improves the reported RewardBench result and HelpSteer2
      average/position-consistent agreement over the seed, without newly supplied human-preference labels in
      that training loop.
    - Success depends on constructing a likely worse response by changing the instruction, selecting reasoning
      prompts and rejection-sampling judgments that agree with the synthetic preference. Each iteration trains
      again from the original seed.
    - MT-Bench agreement improvements are smaller and not monotonic across iterations; ties are excluded. Some
      RewardBench Chat/category results worsen even while the overall score improves.
    - AppendixA.3 tests response order, showing substantial residual order sensitivity in the same fifth-iteration
      model and recommends averaging both orderings. Classifier reward models can still outperform the generative
      recipe.
    counterevidence: This is affirmative evidence that synthetic training can improve a judge under tested
      endpoints. It does not make judgments independent of the seed/constructed data, demonstrate universally
      better evaluation or prove downstream RL policy gains. Added majority-vote inference has a different
      sampling cost.
    next_check: Pin exact RewardBench implementation/aggregation and inference budget for numerical comparisons;
      test downstream policy effects, broader tasks and adversarially selected failures before claiming general
      evaluator replacement.
