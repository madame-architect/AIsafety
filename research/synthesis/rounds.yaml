  - id: r2_oversight_02
    citation_key: arnesen_trainingwindebates_2024
    theme: oversight_control
    reading_depth: Selected sections
    edition_match: same_record
    edition_match_note: The retained arXiv 2409.16636v1 matches the canonical preprint title/authors. Final-venue
      or later-version equivalence was not checked.
    coverage_effect: scoped_review
    scope: Complete main text §§1–6, printed pp 1–10; acknowledgments/references inspected in the extraction;
      Appendices A–G, printed pp 16–23, plus H opening/evaluation prompt on p 24. The rest of H and sample
      transcriptsI pp 31–48 were not read.
    locators:
    - §§2.1–2.4 task, protocols and endpoints; §§3.1–3.2 judge/SFT/DPO training
    - §4.2 reported training gain; §4.3 information exposure versus refutation
    - §5.2 limitations; Appendix B training data; Appendix D judge labels; Appendix G one-turn ablation
    visual_check: No independent visual figure/table inspection; extracted text, captions and readable table
      cells only.
    limitations: No full 48-page read, remaining prompt/transcript appendix read, chart transcription, significance
      recomputation or experiment replication. Main text and captions were checked; graph values were not independently
      digitized.
    replication_status: not_performed
    numerical_check: No numerical recomputation or experimental replication.
    findings:
    - The paper trains Llama 3-8B debaters with SFT then modified self-play DPO and reports more accurate judgments
      as debate skill improves; this adds an actual training strand beyond the earlier inference-time comparisons.
    - On 433 filtered QuALITY-HARD validation questions, the paper reports a 4-percentage-point increase in
      GPT-4-Turbo judge accuracy between SFT and fully trained debate models; this is source-reported, not
      independently recomputed.
    - 'Double consultancy closes much of the gap: pooled checkpoint accuracies are reported as 68% single consultancy,
      72% ensembled, 75% double consultancy and77% debate. One-turn experiments provide little evidence that
      explicit refutation drives accuracy.'
    - The judge is finetuned on prior human judgments and initial SFT uses prior human/GPT-4 transcripts; the
      claim that gains require no ground-truth training signal is limited to the subsequent self-play objective,
      not the whole pipeline.
    counterevidence: Information asymmetry over reading comprehension differs from a general expertise gap.
      Double consultancy and one-turn results favor evidence exposure and training incentives over a simple
      refutation explanation. Dataset/transcript lineage overlaps Michael/Khan work, so this is not independent
      raw evidence from those sources.
    next_check: Retain a qualitative affirmative training result; verify remaining prompts/transcripts and
      uncertainty calculation before leading publication with the 4-point estimate.
    relevance: claim_evidence
    relevance_note: Adds affirmative oversight/control evidence and conditions missing from the existing broad
      map; source counts are not independent corroboration.
