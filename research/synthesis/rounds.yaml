  - id: r2_oversight_05
    citation_key: greenblatt_controlimprovingsafety_2024
    theme: oversight_control
    reading_depth: Selected sections
    edition_match: same_record
    edition_match_note: Publisher-owned mlresearch/v235 metadata explicitly identifies this 42-page PDF as
      greenblatt24a, ICML2024 pp 16295–16336, matching canonical fields. The proceedings landing returned503
      and the ordinary PDF route404; the publisher repository supplied the linked PDF.
    coverage_effect: scoped_review
    scope: Published primary main text §§1–6, printed pp 1–9, including Table 1 and figure captions; Appendix
      K sampling/uncertainty text pp 22–23 and selected Appendix L/M protocol details/Table 5 pp 23–25. Other
      appendices/examples not fully read.
    locators:
    - §§2.1–2.5 resources, metrics, audit assumptions and simplifications
    - Table 1 printed p 4; §3.5 trusted editing p 8; §5/Impact Statement pp 8–9
    - Appendix K pp 22–23; Table 5 p 25
    visual_check: No independent visual figure/table inspection; extracted text, captions and readable table
      cells only.
    limitations: No full 42-page read, remaining detailed red-team prompts/example investigation, raw simulations
      or replication. The observed HTTP MIME was application/octet-stream; PDF type was verified from%PDF bytes
      and pdfinfo. Publisher raw URL is mutable; local bytes/hash identify the inspected edition.
    replication_status: not_performed
    numerical_check: No numerical recomputation or experimental replication.
    findings:
    - AI control evaluates whole protocols under intentional-subversion threat models, adding an affirmative
      system-level intervention strand beyond evaluating a model alone. Trusted editing and safeguarded untrusted
      monitoring improve the constructed safety/usefulness frontier relative to simple baselines.
    - Table 1 reports trusted editing at 20% with 92% scenario safety and94% rescaled usefulness. Safety is
      no submitted exploitable backdoor over a simulated5000-problem scenario, not per-problem accuracy or
      deployment safety.
    - High-quality human labor is simulated by trusted GPT-4, audit correctness benefits from the backdoor
      definition, and model interactions on 1500 problems are resampled into2000 simulated5000-problem scenarios.
      The study has no validation/test split and constrains red-team state/tools.
    counterevidence: The controlled protocol comparison provides positive evidence conditional on the threat
      model, but optimistic auditor assumptions, constrained attacks, resampling and task reuse could inflate
      estimates. It does not establish natural scheming incidence or ordinary deployment harm reduction.
    next_check: Use the published edition and qualitative protocol improvement; carry metric/auditor/sampling
      assumptions with any92%/94% figure. No need to hold the broader argument on unreplicated simulation estimates.
    relevance: claim_evidence
    relevance_note: Adds affirmative oversight/control evidence and conditions missing from the existing broad
      map; source counts are not independent corroboration.
