    - openai_monitoringmonitorability_2025
  - id: safeguards
    label: Safeguards, adaptive evaluation and collateral effects
    selection_reason: Tests positive methodological/control evidence against attack adaptivity, judge and utility
      limits; resolves HarmBench family and CyberSecEval2 numerical leads.
