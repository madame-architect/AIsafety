  - id: r2_oversight_01
    citation_key: sudhir_benchmarkscalableoversight_2025
    theme: oversight_control
    reading_depth: Full text
    edition_match: same_record
    edition_match_note: Canonical preprint is arXiv 2504.03731, year2025; retained v1 cover names the ICLR2025
      BiAlign workshop. No main-conference publication claim is made.
    coverage_effect: complete_record_text
    scope: 'All 15 PDF pages of accessible extracted text read: main §§1–5, captions, Table 1, references,
      and Appendices A–D including setup, pseudocode and prompts. Linked code was not inspected.'
    locators:
    - §2 ASD definition and weak-baseline examples, printed pp 3–4
    - §3.1 benchmark limitations; §4 demonstrative results
    - '§5 and Appendix A: 100 GSM8K questions, one gpt-4o-mini judge'
    - Table 1 printed p 9; Appendices B–D printed pp 12–15
    visual_check: No independent visual figure/table inspection; extracted text, captions and readable table
      cells only.
    limitations: Plot coordinates/error bars were not digitized and linked implementation was not inspected.
      Printed pseudocode duplicates agent_response rather than appending adversary_response; whether this is
      only a documentation error is unresolved and no implementation-error conclusion is drawn.
    replication_status: not_performed
    numerical_check: No numerical recomputation or experimental replication.
    findings:
    - Agent score difference compares the reward for prompted true-answer advocacy versus prompted false-answer
      advocacy; judge accuracy need not measure the same incentive under consultancy.
    - In the demonstrative100-question, one-judge setting, debate has higher reported average ASD than the
      tested consultancy and NaiveJudge variants. The protocol called Propaganda is a single-argument proxy,
      not an actual RLHF training run.
    - The authors distinguish average ASD from worst-case catastrophic failure and call their experiments small/demonstrative.
    counterevidence: Truth/falsehood are simulated with instructed current models and known ground truth. Extrapolating
      ASD versus expected agent score to future models is proposed rather than validated; the work does not
      demonstrate general incentive compatibility.
    next_check: Use the metric distinction without the headline that debate beats RLHF. Inspect pinned implementation
      before numerical reuse or before attributing significance to pseudocode discrepancies.
    relevance: claim_evidence
    relevance_note: Adds affirmative oversight/control evidence and conditions missing from the existing broad
      map; source counts are not independent corroboration.
    claim_ids:
    - C32
