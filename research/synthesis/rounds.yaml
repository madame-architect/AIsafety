  readings:
  - id: r3_mechvalidation_01
    citation_key: karvonen_measuringprogressdictionar_2024
    theme: mechanistic_validation
    reading_depth: Full text
    edition_match: same_record
    edition_match_note: Exact arXiv identifier, title, and author match to the authoritative record; pinned
      arXiv:2408.00113v2, dated 30 October 2024 on the PDF cover; NeurIPS2024 footer. This event certifies
      this arXiv edition only, not identity with a separately published proceedings version or future revisions.
    coverage_effect: complete_record_text
    scope: 'Complete pinned 21-page arXiv v2 PDF: abstract, Sections1–8, author contributions, acknowledgments,
      references, Appendices A–G, Tables1–5, Figures1–6. Linked code, model weights, datasets, and other papers
      were not opened or reproduced.'
    locators:
    - 'Sections2.1–3.2, pp.2–5: eight-layer chess/Othello models, researcher-specified BSPs, coverage and board
      reconstruction definitions'
    - 'Section5, pp.7–9; Table1 p.8; Figures2–4 pp.6–9: trained/random comparison and p-annealing comparisons'
    - 'Section6 p.9: domain, researcher ontology, and downstream-use limitations'
    - 'AppendixD, pp.18–19, Tables4–5: per-property trained/random comparisons'
    - 'AppendixF.2 p.20: masking initial board locations and layer1 positional shortcut control'
    visual_check: Rendered and visually inspected every figure (1–6) on PDF pages2,6,7,9,20,21; inspected plotted
      axes/legends, board examples, and Table1 plus Tables2–5 in text. No external feature dashboard or executable
      artifact inspected.
    limitations: Two small eight-layer GPT board-game models, residual stream after layer6, hand-selected board/strategy
      properties and restricted move positions. Board-property recovery is not a comprehensive dictionary,
      mechanistic pathway audit, natural-language safety evaluation, or deployment validation. No replication.
      Table1 and Table4 use similarly named board-state reconstruction results without enough reporting detail
      here to certify identical aggregation/selection; do not collapse them into one best-score claim.
    replication_status: not_performed
    numerical_check: Documentary comparison of reported metrics and controls only; no data extraction, uncertainty
      recalculation, model execution, or experimental reproduction.
    findings:
    - 'The paper supplies affirmative reference-task validation: features recover formally specified board
      properties, and board-state metrics distinguish trained models from same-architecture random-weight controls
      (Section5/Table1).'
    - Coverage averages the best single-feature F1 for each researcher-selected BSP; reconstruction combines
      features having at least .95 training precision and evaluates board-level F1 on a distinct test set of1000
      games (Section3.2). These measure recovery under a specified feature ontology rather than all possible
      model knowledge.
    - AppendixF.2 explicitly removes pieces at initial locations to reduce positional shortcuts. The layer1
      SAE reconstruction F1 is reported as .01 under this restriction versus .52 when initial locations are
      included; the authors attribute the latter to PGN token position. This is a reported documentary control,
      not a reproduced result.
    - AppendixD/Table5 shows some random-model strategy properties score highly when correlated with syntax
      or move number, including queen/castling-related properties. “Ground truth” labels alone do not eliminate
      shortcuts.
    - p-annealing improves over standard L1 SAEs on tested proxy and supervised metrics; coverage also reveals
      expansion-size differences not evident in earlier unsupervised plots. Linear probes still outperform
      the SAEs on board recovery.
    counterevidence: Random-weight controls are weak on full board reconstruction but can be strong on some
      strategic labels; linear probes remain better and the paper explicitly says downstream interpretability
      tasks are not tested. The existence of useful discriminating metrics challenges an undifferentiated reading
      that SAE evaluation cannot separate learned structure from random structure.
    next_check: If a publication-leading reconstruction number is needed, inspect released evaluation code/results
      to reconcile Table1 game-level G_board-state reconstruction with Table4 grouped per-property comparisons,
      verifying target, averaging, SAE selection, and masking. Retain a qualitative statement until those match.
      Test whether analogous controls survive more complex language tasks.
    relevance: claim_evidence
    relevance_note: Adds affirmative validation and boundaries to C13; maps the source to specific new claims
      without treating source inclusion or separate-agent checking as independent corroboration.
