      on failure mode and cost. Removing hidden-scratchpad instructions reduces sabotage, whereas revealing
      an assumed-hidden scratchpad is explicitly an artificially easy sanity check.
    counterevidence: Complex agent tasks and positive held-out monitor improvements expand the evidence beyond
      MCQs. Task heterogeneity, execution bottlenecks, post-hoc detection and conditional analysis prevent
      a universal monitor-performance or human-replacement claim.
