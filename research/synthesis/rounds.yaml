  - id: r2_oversight_03
    citation_key: lang_debatehelpsweak_2025
    theme: oversight_control
    reading_depth: Selected sections
    edition_match: same_record
    edition_match_note: Canonical arXiv 2501.13124 identifies this v1; retained PDF has9 pages, while the inherited
      ledger says a 17-page full read. The earlier representation/edition remains unverified, so this event
      does not certify that prior reading label.
    coverage_effect: scoped_review
    scope: Selected introduction/related-work distinction, complete methods/setup and main-results/ablation/limitations
      text, including Tables 1–5 and Figure 2–3 captions. Final references and any final-AAAI-version differences
      were not completely checked.
    locators:
    - Preliminaries PGR definition; Methods and Experimental Setups
    - Table 2 raw accuracy and PGR; Tables 4–5 comparator/ensemble ablations
    - Ablation on number of turns; Limitations and Conclusion
    visual_check: No independent visual figure/table inspection; extracted text, captions and readable table
      cells only.
    limitations: No complete-document reread, final venue authentication, plot digitization, significance/raw-run
      verification or replication. The converted binary tasks and model/compute gap constrain transfer.
    replication_status: not_performed
    numerical_check: 'Documentary arithmetic only: 100*(student−weak)/(ceiling−weak), using rounded Table 2
      accuracies, reproduces76.5/69.2/56.5/70.0. No model experiments or statistical uncertainty reproduced.'
    findings:
    - Debate ensembles used to train a weak Qwen-7B supervisor improve the subsequently trained Qwen-14B student
      on all four tested converted binary NLP tasks relative to listed baselines. This is training via improved
      weak supervision, not only inference-time judge assistance.
    - PGR percentages76.5, 69.2, 56.5, 70.0 in Table 2 correspond to raw accuracy differences of 2.6, 2.7,
      1.3, 1.4 percentage points over the weak models; normalization and denominator must remain explicit.
    - The authors use a four-member ensemble and three debate turns. More turns did not improve final performance
      in the reported two-task ablation; they acknowledge extra cost, a small 7B/14B size gap and weak consultancy
      comparator.
    counterevidence: The best result combines debate, diverse sampling and ensembles with more computation;
      the comparison does not isolate debate as a universally superior training intervention or establish superhuman
      alignment.
    next_check: Add the training strand and cost/comparator conditions. Resolve the 9-versus17-page prior-reading
      representation before treating inherited full-text provenance as established; confirm final AAAI metadata
      separately.
    relevance: claim_evidence
    relevance_note: Adds affirmative oversight/control evidence and conditions missing from the existing broad
      map; source counts are not independent corroboration.
