  - id: r2_oversight_06
    citation_key: korbak_chainthoughtmonitorability_2025
    theme: oversight_control
    reading_depth: Full text
    edition_match: same_record
    edition_match_note: Canonical arXiv 2507.11473 work matches retained v2; the inherited ledger specifically
      describes v2. This fresh full read does not create an additional previously non-full record.
    coverage_effect: complete_record_text
    scope: 'All 11 PDF pages of accessible extracted text read: §§1–6, Figure 1 caption and references. No
      separately linked source papers/interactives were read for this event.'
    locators:
    - §1.1 externalized reasoning does not guarantee incriminating content; §1.2 necessity versus propensity
    - §3 direct/end-to-end evaluation proposals; §4 development/deployment choices
    - §5 process-supervision and other limitations
    visual_check: No independent visual figure/table inspection; extracted text, captions and readable table
      cells only.
    limitations: This is a position/research-agenda paper that synthesizes cited experiments, not a new primary
      monitoring-effect trial. Architecture diagram was read through caption/text, not independently visually
      evaluated; references are not audited by reading their citation strings.
    replication_status: not_performed
    numerical_check: No numerical recomputation or experimental replication.
    findings:
    - The paper argues for CoT as an additional monitoring channel without requiring a complete faithful account
      of all computation. It distinguishes necessity to reason externally from propensity to verbalize.
    - 'It explicitly allows tradeoffs: process supervision could improve alignment enough to justify a small
      loss of monitorability; preserving current CoT behavior unconditionally can miss productive safety interventions.'
    - It recommends direct/end-to-end adversarial evaluations and treating monitorability alongside propensity
      and operational response, rather than equating monitor accuracy with harm prevention.
    counterevidence: A benign-looking CoT does not establish absence of bad intent; some harmful tasks need
      little external reasoning and future models may hide or compress relevant information. These limits coexist
      with conditional utility.
    next_check: Use as conceptual framing/background supporting a separate empirical monitorability study,
      not as independent empirical corroboration of that study.
    relevance: claim_evidence
    relevance_note: Adds affirmative oversight/control evidence and conditions missing from the existing broad
      map; source counts are not independent corroboration.
