  - id: r2_oversight_04
    citation_key: burns_weakstronggeneralization_2024
    theme: oversight_control
    reading_depth: Selected sections
    edition_match: related_edition
    edition_match_note: The canonical record names ICML2024 proceedings. This capture is the original arXiv
      2312.09390v1, 14Dec2023; equivalence with the final proceedings edition was not established. An initial
      v3 route returned404; the arXiv submission history identified v1.
    coverage_effect: scoped_review
    scope: 'Selected primary preprint text: pp 1–10 abstract/introduction/related work, methodology and main
      results; §5.1 pp 11–12 overfitting text; §6.1–6.2 pp 16–18 disanalogies/future-work text. Remaining methods/results
      pages and appendices were not completely read.'
    locators:
    - §3 PGR and weak/strong/ceiling setup; §4.1 tasks and no downstream RL step
    - §4.2 task-dependent results; §§4.3.1–4.3.2 bootstrap/confidence loss
    - §5.1 overfitting; §6.1 imitation saliency and pretraining leakage
    visual_check: No independent visual figure/table inspection; extracted text, captions and readable table
      cells only.
    limitations: Large49-page preprint only selected sections; not final ICML verification, complete appendix
      read, graph transcription or replication. PDF extraction reported a recoverable xref warning; inspected
      text is coherent, but complete extraction fidelity was not certified.
    replication_status: not_performed
    numerical_check: No numerical recomputation or experimental replication.
    findings:
    - Strong students trained on weak labels can outperform their weak supervisors on the tested NLP, chess
      and reward-modeling tasks, with substantial task-dependent residual gaps.
    - Auxiliary confidence loss improves many NLP settings; bootstrapping improves chess but has little/no
      improvement in the reported NLP/reward-modeling preliminary comparisons. No method works universally.
    - The authors explicitly do not study the RL optimization step on the learned reward model. They identify
      weak-error imitation and pretraining leakage as disanalogies that could make the proxy overly optimistic.
    counterevidence: Positive recovery of held-out task performance is useful experimental progress rather
      than assurance about a deployed reward model. Ground truth was available for methodology development/evaluation,
      and future latent superhuman knowledge could be harder to elicit.
    next_check: Inspect the final ICML edition and missing appendices before final numerical citation; keep
      qualitative recovery and task-dependent failure modes. Reconcile metadata claiming independence from
      the subject when OpenAI authors studied internal GPT-family models.
    relevance: claim_evidence
    relevance_note: Adds affirmative oversight/control evidence and conditions missing from the existing broad
      map; source counts are not independent corroboration.
