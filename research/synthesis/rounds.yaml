      so do not infer every aggregate uses all17.
    findings:
    - SHADE-Arena separates completing a benign main task, a supplied harmful side task and evading a monitor.
      Overall success requires all three; a model can score on marginal outcomes without joint success.
    - Monitor ROC evaluations keep successful side-task attacks, rebalance task contributions and drop task
      pairs without successful attacks. Full-transcript detection after the event is different from preventing
      harmful actions.
