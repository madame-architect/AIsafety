schema_version: synthesis-review-rounds-v1
rounds:
- id: thematic-challenge-2026-11-14
  as_of: '2026-11-14'
  base_commit: 269d2856bab868ecce3d80ac2fb36f273fb5d22a
  question: Which missing arguments and counterevidence change the existing broad synthesis, and which consequential
    numerical/version claims survive deeper source inspection?
  selection_basis: Purposive, claim-sensitive selection from the existing corpus and reconciliation queue.
    The baseline has27 claims/60 mapped keys,226 unmapped roles, and181 records without inherited full-text
    labels. Four complementary themes include27 initially unmapped records; three mapped sources receive targeted
    numerical/version checks. This is not a systematic sample or preregistration. The working selection is
    recorded before integration; source acquisition began in parallel.
  stopping_rule: Finish one reviewable bounded round with explicit source scopes and thematic consequences.
    Read manageable claim-critical texts fully where feasible; use scoped methods/appendix checks for long
    or related editions. Stop chasing inaccessible historical inputs after a documented bounded attempt; omit
    or qualify affected numbers. Carry forward the remaining corpus and deferred themes.
  themes:
  - id: oversight_control
    label: Oversight, control and learning from weaker feedback
    selection_reason: Tests whether the inference-time oversight narrative misses training results, stronger
      simple comparators, control protocols or monitorability constraints.
    citation_keys:
    - burns_weakstronggeneralization_2024
    - lang_debatehelpsweak_2025
    - arnesen_trainingwindebates_2024
    - greenblatt_controlimprovingsafety_2024
