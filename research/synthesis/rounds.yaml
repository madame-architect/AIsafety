    citation_key: wan_foundationmodeltransparency_2025
    theme: provider_implementation
    reading_depth: Selected sections
    edition_match: same_record
    edition_match_note: Same work/title/date; exact arXiv 2512.10169 v1 dated 11 December 2025 pinned rather
      than mutable latest URL.
    coverage_effect: scoped_review
    scope: 'Exact arXiv v1 PDF pp. 1,3–6,14–19,32–39,48–49: abstract, index/instrument background and changes,
      full §§4.1–4.5 methods, overall results/Figure 7, reporting-method comparison, longitudinal discussion/Figures
      16–17/Table 3, conclusion/conflicts, and AppendixA including agent prompt and retrieval comparison. Other
      results subsections, indicator tables and bibliography pages not fully read.'
    locators:
    - §§3.1,3.3, pp. 5,14–15; Figure 6 p. 14
    - §§4.1–4.5 pp. 15–18; Figure 7 p. 19
    - Figure 15 pp. 32–33; §5.3/Figures 16–17/Table 3 pp. 33–37
    - AppendixA pp. 48–49
    visual_check: No rendered figure inspection; numerical figure labels and table text were read in the PDF
      text extraction. Figure 7 arithmetic checked separately.
    limitations: 'No independent re-scoring of the 1,300 cells, developer report/source audit, evaluation reproduction
      or complete 49-page reading. The authors identify industry affiliations on p. 39; external FMTI scoring
      does not make issuer disclosures independent evidence of practice. Two internal prose issues retained
      in notes: p. 33 says seven reports in 2024 where Figure 16 says 2025; p. 37 says Meta dropped 23 from
      2024–25 while Figure 16 says 29. Neither inconsistent prose number is used as a new result.'
    replication_status: not_performed
    numerical_check: 'Figure 7:13 scores sum 529; mean 40.6923077 rounds 40.69. Agreement: (1300−138)/1300=89.3846%,
      consistent with 89.4%. Figure 16 scores:7/9 lower; Meta 60→31 is−29. No experiment reproduced.'
    findings:
    - 'FMTI 2025 assesses 13 developers on 100 disclosure indicators each: 1,300 developer–indicator pairs,
      independently assigned by two FMTI team scorers before consensus. It is a disclosure-measurement exercise,
      not an operational compliance audit or causal estimate of safety effects.'
    - Seven companies prepared solicited reports; for six others the team searched official company artifacts,
      complemented by an agent search whose findings required expert checking. All 13 companies were offered
      a response phase. New information could be disclosed through the reports and responses; the source set
      was not restricted to information public before solicitation.
    - AppendixA explicitly says all published scores reflect FMTI-team judgments; no published scores were
      proposed or directly determined by an AI system. Agent retrieval used official-company-domain constraints
      and could generate false positives and false negatives; source dependence on issuer communications remains.
    - Figure 7 scores sum to 529, giving 529/13=40.6923; Results uses 40.69/100, whereas abstract says 40.
      Report 40.69 or approximately 41, or reproduce the abstract as an attributed quotation rather than silently
      treating 40 as the exact mean.
    - 'Instrument comparison is materially confounded: 55 indicators are new and only nine are unchanged. Figure
      16 holds nine companies constant and finds seven lower 2025 scores, but indicators, reporting mechanisms
      and flagship models still differ. Table 3 supplies narrower examples of reduced disclosure, not proof
      that underlying practices ceased.'
    - 'Positive mechanism: solicited structured reports and response engagement elicit additional disclosures,
      with responses clarifying/correcting/updating information for a reported mean 18.9 indicators and increasing
      scores by mean 9.71. The seven report-preparing companies score 54.1 on average versus 25.0 for six FMTI-prepared
      reports; selection and disclosure effort are alternative explanations, so this gap is not a causal intervention
      effect.'
    - Points can be awarded for disclosure of information dependencies or contractual restrictions in the circumstances
      described on p. 15. A missing point therefore cannot be uniformly interpreted as absence of a control
      or practice, nor can a point uniformly mean the requested underlying measurement was supplied.
    counterevidence: IBM 95, Writer 72 and AI 21 Labs 66 demonstrate high disclosure scores are achievable
      in this instrument; report engagement yields useful new information. Selection, changed instrument/flagship
      models and security/commercial disclosure tradeoffs bound interpretation of both gaps and regressions.
    next_check: Retain exact mean/method denominators and distinguish non-disclosure from practice absence.
      Audit leading indicator-level examples against the published developer reports before attributing a regression
      to a particular organizational practice. If a trend claim leads publication, compare the fixed nine unchanged
      indicators and constant developers; do not present aggregate decline as a controlled estimate.
    relevance: claim_evidence
    relevance_note: Adds a measured disclosure result and a positive reporting mechanism while bounding the
      inference from disclosure to implementation.
