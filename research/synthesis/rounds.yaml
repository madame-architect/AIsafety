  - id: r3_mechvalidation_02
    citation_key: cunningham_sparseautoencoders_2024
    theme: mechanistic_validation
    reading_depth: Full text
    edition_match: same_record
    edition_match_note: Exact arXiv identifier, title, and author match to the authoritative record; pinned
      arXiv:2309.08600v3, dated 4 October 2023 on the PDF cover. This event certifies this arXiv edition only,
      not identity with a separately published proceedings version or future revisions.
    coverage_effect: complete_record_text
    scope: 'Complete pinned 20-page arXiv v3 PDF: abstract, Sections1–6, acknowledgments, references, Appendices
      A–G, Tables1–2, Figures1–18. This is the arXiv edition dated 4 October 2023, not a newly inspected ICLR2024
      proceedings artifact. No linked code, source data, or model weights executed.'
    locators:
    - 'Sections2–3, pp.2–5: tied-weight SAE methods, baselines, automatic interpretation'
    - 'Sections4.1–4.2, pp.5–6, Figure3: Pythia410M IOI counterfactual activation patching and edit-magnitude
      comparisons'
    - 'Section5, pp.6–8, Figures4–5: selected token-feature ablations and closing-parenthesis causal tree'
    - 'Section6.2 pp.8–9: reconstruction residuals, perplexity increase, architecture/layer and task-generalization
      limitations'
    - 'AppendixA pp.11–12: GPT4 explanations/GPT3.5 simulation, top-random mixture, skipped low-variation features'
    - 'AppendicesC.2–C.3 pp.13–15 and G pp.18–20: random-only scoring, dead MLP features, matched top-K baseline'
    - 'AppendicesD.3–D.4 pp.16–17 and F pp.18–19: selection procedure, failed weight-only circuit method, other
      IOI layers'
    visual_check: Rendered and visually inspected all Figures1–18 on PDF pages2,4,5,7,8,12–20, including other-layer
      IOI curves and top-K baselines. Figures16–17 contain dense panels and were read as qualitative trends,
      not digitized numerical estimates. Tables1–2 read in PDF text and rendering.
    limitations: Pythia70M/410M and Pile/OpenWebText; selected IOI templates and token-feature examples. The
      same IOI task family used in later Makelov work is not an independent task replication. Automatic scores
      do not certify semantic completeness; selected ablations do not establish reliable safeguards. ArXivv3
      is identified by the authoritative record’s exact eprint/DOI; the record’s separate ICLR2024 venue/year
      is not recertified by this reading.
    replication_status: not_performed
    numerical_check: Documentary comparison of reported metrics and controls only; no data extraction, uncertainty
      recalculation, model execution, or experimental reproduction.
    findings:
    - On IOI, counterfactual feature patching on Pythia410M can move output distributions toward the counterfactual
      target with fewer patched directions and smaller edits than PCA/non-sparse dictionaries under the reported
      selection procedure (Section4/Figure3). This is affirmative task-level causal utility, distinct from
      automatic interpretability scoring.
    - The ACDC feature ordering is selected separately per decomposition by average KL divergence over50 IOI
      datapoints; the patch adds coefficient differences times learned decoder directions to original activations.
      The evidence is targeted intervention success under this setup, not recovery of every causally important
      feature.
    - Selected apostrophe and closing-parenthesis examples use ablation effects on logits/upstream features,
      giving causally checked examples beyond input correlation. AppendixD.3 explains feature searching/selection,
      so examples should remain described as selected case studies.
    - Random-only fragment scoring is much lower than top-random scoring but retains the early-layer relative
      advantage; top-K PCA/ICA controls explain only a small fraction of the score gap. Late-layer advantage
      is smaller, and MLP dictionaries have many dead features (AppendixC/G).
    - 'Reconstruction loses behaviorally relevant information: Section6.2 reports layer2 Pythia70M replacement
