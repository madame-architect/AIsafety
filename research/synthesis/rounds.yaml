    citation_key: meta_advancedaiscalingframeworkv2_2026
    theme: provider_implementation
    reading_depth: Selected sections
    edition_match: same_record
    edition_match_note: CoverVersion 2 and AppendixII explicitly identifies 7 April 2026 Advanced AI Scaling
      Frameworkv 2.0, matching canonical record. Do not treat later retrieval date as a later policy edition.
    coverage_effect: scoped_review
    scope: 'PDF pp. 1–17,25–28,39–44: executive summary, scope, complete governance/transparency/accountability
      sections, outcomes/threat-model inclusion criteria and risk thresholds, evaluation environment and elicitation/deployment-context
      passages, first cybersecurity threshold example, benefits assessment, future work, terminology and change
      log. Risk-domain scenarios and detailed domain-specific implementation pp. 18–24,29–38 not read in full.'
    locators:
    - '§§1–2 pp. 3–11: scope/governance/preparedness reports/accountability'
    - §§3.1–3.3 pp. 12–17; Table 1 p. 15
    - §§4.1–4.2 pp. 25–28; §4.3/§5 pp. 39–40
    - AppendixI pp. 41–43; AppendixII change log p. 44
    visual_check: No rendered visual inspection. Table 1 and terminology read in PDF text extraction.
    limitations: Not a full 44-page reading, independent adherence audit or verification of a released model’s
      preparedness report. Prior policy was not independently retrieved; comparisons with v1 are attributed
      to the inspected v2 change log. Institutional and causal efficacy remains untested here.
    replication_status: not_performed
    numerical_check: 'Source comparison only: v2 Table 1/§3.3/AppendixII checked for consistency of threshold/response
      language. Compute threshold 10^26 is a definitional trigger, not measured risk or a safety result. No
      experiments reproduced.'
    findings:
    - Version 2 defines pre-mitigation risk tiers and conditions deployment/development on mitigations. Critical
      and high models may deploy only with sufficient defined, implemented and validated mitigations reducing
      risk to moderate or lower; §3.3 further conditions continued development of critical models. These are
      declared conditions, not evidence a particular model satisfied them.
    - 'AppendixII describes two coupled changes: primary threshold language moves from uniquely enable to substantially
      contribute; tier labels move from Stop/Do not release to Develop with Mitigations/Deploy with mitigations.
      The new criterion and response must be read together, without assuming a uniform tightening or weakening.'
    - Concrete accountability mechanisms include named Chief AI Officer/Director of Alignment and Risk responsibility,
      risk review, preparedness-report contents/update triggers and incident response. Some reporting/whistleblower
      protocols are still described as developing or future commitments; preserve that tense.
    - 'Framework scope is deliberately narrower than all serious harm: inclusion requires plausibility, catastrophic
      scale, net-new outcome and instantaneous or irremediable impact. It acknowledges gradual or partly remediable
      catastrophic harms are handled outside the Framework. Implementation text acknowledges unknown unknowns,
      deployment-dependent elicitation and incomplete evaluation science.'
    counterevidence: The broader material-contribution trigger and more explicit accountability/reporting are
      positive institutional mechanisms; mitigation-based continuation is conditional, not a demonstrated loss
      of restraint. Conversely the scope excludes some serious harms and self-reported validation does not
      prove external effectiveness.
    next_check: If the policy change becomes a leading normative argument, retrieve and compare exact v1 bytes
      plus dated preparedness reports and actual risk decisions. For now report v2 conditions and scope, attributing
      old/new labels to its change log; leave the overall strengthening/weakening interpretation open.
