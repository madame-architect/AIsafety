      test resolution.
    - The frozen-at-initialization decoder control performs worse than ordinary task-specific SAEs, establishing
      nontrivial control utility for the latter. Full-distribution SAEs perform on par with that frozen-decoder
      control in the reported IOI controllability comparison; interpretation alone is insufficient for sparse
      control (Section5.2).
