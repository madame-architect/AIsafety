    findings:
    - A successful task evaluation distinguishes dictionary reconstruction sufficiency/necessity, sparse control
      of specified attributes, and causal consistency of feature interpretations. The supervised dictionaries
      are tested as a task-specific reference, rather than assumed to be complete truth (Sections3–4).
    - Both task-specific and full-distribution SAEs contain interpretable IOI features, but task-specific SAEs
      fall short of supervised dictionaries on sparse control and full-distribution SAEs perform worse (Section5.2).
