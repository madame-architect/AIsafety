- id: C09
  section: evaluator_integrity
  claim: Position calibration improved agreement with one author-majority reference, and the highest reported
    agreement included human input.
  status: provisional
  evidence:
  - citation_key: wang_largenotfairevaluators_2024
    relation: supports
    version_url: https://aclanthology.org/2024.acl-long.511.pdf
    locator: ACL 2024 pp.9444–9445, §§2.3.3,3.1–3.3; Table 4
    finding: Agreement rises from 52.7% to 62.5% with multiple evidence sampling and to 73.8% with selected
      human labels; three author annotators supplied the reference on 80 questions.
    review_basis: prior_audit
    checked_scope: Prior audit checked selected proceedings sections and Table 4; not an independent full 11-page
      reread or code execution.
  limitation: The 73.8% score belongs to the combined human-assisted procedure. Individual annotators contribute
    to the majority against which they are compared.
  counterevidence: Swapping response positions changes results, but the experiment does not establish the mechanism
    of bias or performance on new judge models and tasks.
  next_check: Use a separate held-out human reference and report routed human items independently when evaluating
    the intended procedure.
- id: C10
  section: evaluator_integrity
  claim: Xu's benchmark exposure indicators are proxies, and its printed edit-similarity rule and threshold
    disagree with the pinned released helper.
  status: provisional
  evidence:
  - citation_key: xu_benchmarkingleakage_2024
    relation: supports
    version_url: https://arxiv.org/html/2404.18824v1
    locator: v1 §5.3; Appendix A.3 Eq.5; pinned metric_utils.py lines 27,47
    finding: Paper prints normalized edit distance and a >0.9 threshold; code calculates its complement and
      uses >0.75.
    review_basis: prior_audit
    checked_scope: Prior audit checked selected paper sections and all 75 lines of the helper at commit 8cbb7fd341f0efe840ed5d9b148b87287362d9e9;
      no experiment-revision provenance or 186-row recomputation repeated.
  limitation: Original-versus-paraphrase familiarity is indirect evidence of exposure. The helper mismatch
    does not identify which implementation generated the reported experiment.
  counterevidence: Exact string matches and controlled exposure experiments establish proxy behavior; they
    do not turn each flagged item into a verified leaked training record.
  next_check: 'Reconcile experiment revision, formula, threshold and mixed table units before reusing affected
    quantitative leakage rates; code: https://github.com/GAIR-NLP/benbench/blob/8cbb7fd341f0efe840ed5d9b148b87287362d9e9/src/metric_utils.py.'
- id: C11
  section: evaluator_integrity
  claim: Debate can improve inference-time judge accuracy under information asymmetry, while comparison with
    direct QA depends on task and source access.
  status: scoped_check
  evidence:
  - citation_key: khan_debatingmorepersuasive_2024
    relation: supports
    version_url: https://arxiv.org/html/2402.06782v4
    locator: v4 abstract and §3 main results; §2 task setup
    finding: On filtered binary QuALITY questions, reported LLM/human debate accuracy is 76%/88%, compared
      with 48%/60% naive and 54%/78% assigned consultancy.
    review_basis: this_run_primary
    checked_scope: Selected primary abstract/main results and task-setup text checked; no full appendix/human-sampling
      audit or numerical reproduction.
  - citation_key: kenton_scalableoversightweak_2024
    relation: bounds
    version_url: https://arxiv.org/html/2407.04622v2
    locator: v2 §§3.2,4.1; Figure 2 accompanying prose
    finding: Full-article direct QA performs best across tested extractive judge configurations; debate's gains
      over QA without the article vary by judge/task.
    review_basis: this_run_primary
    checked_scope: Selected primary protocol definitions, main results and figure-caption prose; no complete
      reread or statistical recomputation.
  limitation: Khan's naive human baseline used a separate experiment and its full-source human comparison is
    external, as recorded in the supplied ledger. These studies test inference properties, not a complete training
    protocol.
  counterevidence: Kenton's stronger direct-QA baseline and weak-judge exceptions bound a blanket debate-superiority
    claim without negating Khan's gains under its setup.
  next_check: Preserve task, source access, role assignment, judge sampling and comparator; verify final proceedings/version
    differences and remaining appendix details before numerical publication.
- id: C12
  section: evaluator_integrity
  claim: Evidence selection and error detection offer distinct interpretations of debate benefits; overall
    accuracy alone does not resolve them.
  status: scoped_check
  evidence:
  - citation_key: khan_debatingmorepersuasive_2024
    relation: supports
    version_url: https://arxiv.org/html/2402.06782v4
    locator: v4 Appendix A.6 and Figure 15 caption
    finding: Quotes-only yields higher judge accuracy than quotes-plus-arguments in the reported ablation;
      arguments-only is worse.
    review_basis: this_run_primary
    checked_scope: Complete selected Appendix A.6 text and Figure 15 caption inspected; chart values not independently
      transcribed.
  - citation_key: kenton_scalableoversightweak_2024
    relation: supports
    version_url: https://arxiv.org/html/2407.04622v2
    locator: v2 §4.2 and Figure3 discussion
    finding: Open debate better rejects an incorrect protagonist than open consultancy, at a cost when the
      protagonist is correct.
    review_basis: this_run_primary
    checked_scope: Selected open-role methods and results text inspected; transcript reuse design noted, no
      new model runs.
  limitation: Kenton's open protocols select assigned-role transcripts conditional on direct-QA answers rather
    than eliciting autonomous strategy. Khan's quote verification relies on the source and selected questions.
  counterevidence: Higher overall open-consultancy accuracy can coexist with worse detection of protagonist
    errors; quote selection may explain part of the gain attributed to argument exchange.
  next_check: Separate evidence retrieval/verification, correctness-conditioned error detection and judge training
    effects in any follow-up comparison.
