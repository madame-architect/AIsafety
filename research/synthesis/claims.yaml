  - citation_key: heap_sparseautoencoders_2025
    relation: bounds
    version_url: https://arxiv.org/html/2501.17727v1
    locator: v1 §§1,3.1–3.3; Figures1–3 captions
    finding: Several fuzzing/reconstruction metrics are broadly similar across trained and three randomized
