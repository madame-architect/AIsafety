  - citation_key: liu_promptinjectionattacks_2025
    relation: supports
    version_url: https://www.usenix.org/conference/usenixsecurity24/presentation/liu-yupei
    locator: USENIX Security2024 proceedings pp1831–1847; attack/defense benchmark; section8 limitations
    finding: The intended Liu proceedings work benchmarks five attacks and ten defenses across ten models/seven
      tasks. The unrelated StruQ identifier and abstract are removed while retaining the citation key. Section8
      leaves adaptive attacks against known-answer detection for future work.
    review_basis: supplied_ledger
    checked_scope: Inherited full-text scope identifies the17-page intended proceedings paper. This run freshly
