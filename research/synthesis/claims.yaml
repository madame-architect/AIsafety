schema_version: broad-synthesis-v1
as_of: '2026-11-14'
claims:
- id: C01
  section: evaluation_configuration
  claim: The reviewed benchmarks add distinct task, workflow and reliability measurements; each result describes
    its tested configuration.
  status: provisional
  evidence:
  - citation_key: folkerts_measuringaiagentscyber_2026
    relation: supports
    version_url: https://arxiv.org/pdf/2603.11214v3
    locator: v3 §§2–4; Tables 1–2; Appendix E
    finding: Multi-step enterprise and industrial-control ranges expose incomplete progress even at larger
      inference budgets.
    review_basis: supplied_ledger
    checked_scope: 'Inherited full text description: All 30 PDF pages of v3: §§1–6, references, Appendices
      A–E, rendered Figures 1–7, and programmatic verification of all 24 end-to-end summary cells from 1,263
      parsed appendix run rows.; not independently repeated in this integration.'
  - citation_key: xie_osworld_2024
    relation: supports
    version_url: https://proceedings.neurips.cc/paper_files/paper/2024/file/5d413e48f84dc61244b6be550f1cd8f5-Paper-Datasets_and_Benchmarks_Track.pdf
    locator: NeurIPS 2024 proceedings; abstract and benchmark-design passages
    finding: OSWorld tests 369 desktop/web tasks with execution-based grading in controlled environments.
    review_basis: supplied_ledger
    checked_scope: 'Inherited selected sections description: Official NeurIPS proceedings extract, including
      abstract and design passages; not independently repeated in this integration.'
  - citation_key: xu_theagentcompany_2024
    relation: supports
    version_url: https://arxiv.org/pdf/2412.14161
    locator: Benchmark design and setup; inherited extracted lines 0–200/1302 (page locator pending)
    finding: Professional workflows are evaluated within a simulated organization.
    review_basis: supplied_ledger
    checked_scope: 'Inherited selected sections description: Selected extracted PDF passages (line span 0–200
      of 1302); not independently repeated in this integration.'
  - citation_key: yao_taubench_2024
    relation: supports
    version_url: https://arxiv.org/pdf/2406.12045
    locator: Benchmark setup and repeated-trial reliability; inherited extracted lines 0–204/2369 (page locator
      pending)
    finding: Tool use, domain policies and user simulation define a repeated-trial reliability endpoint.
    review_basis: supplied_ledger
    checked_scope: 'Inherited selected sections description: Selected extracted PDF passages (line span 0–204
      of 2369); not independently repeated in this integration.'
  limitation: These controlled tests do not estimate general workplace safety or operational harm. Some inherited
    selected-section locators are extraction spans rather than stable page references. Standalone Cybench is
    cited in the supplied review but absent from the admitted bibliography.
  counterevidence: Realistic software and longer workflows strengthen task relevance; that realism alone does
    not establish transfer to defended deployment or authorization boundaries.
  next_check: Complete claim-critical methods/results and pin stable section/page locators; treat standalone
    Cybench as a source-admission lead, not an admitted record.
- id: C02
  section: evaluation_configuration
  claim: Phuong v2 Table 23 concerns a toy safety-filter modification task in instrumental self-reasoning;
    its Pro-CoT easy/easy score is 0.5 despite a stated 0.7 passing criterion.
  status: scoped_check
  evidence:
  - citation_key: phuong_evaluatingfrontier_2024
    relation: supports
    version_url: https://arxiv.org/html/2403.13793v2
    locator: Appendix F.5–F.5.1; Table 23
    finding: The task classification and numerical tension are present in the primary table and adjacent results
      prose. It is not the final self-proliferation takeover task.
    review_basis: this_run_primary
    checked_scope: Targeted primary HTML text for Appendix F.5–F.5.1, Table 23 and document section headings;
      no full reread, figure audit or replication.
  limitation: This identifies an internal prose/table tension within a toy task; it does not resolve what the
    authors intended as their pass classification.
  counterevidence: The same paper contains separate self-proliferation tasks and modeled milestone bounds in
    Table 11; those cannot be substituted for Table 23.
  next_check: The synthesis task description is corrected here. Seek author clarification before treating the
    inconsistent pass wording as an established capability result.
- id: C03
  section: evaluation_configuration
  claim: Rankings and apparent capability gains can change with inference budgets, attempt aggregation and
    task selection.
  status: scoped_check
  evidence:
  - citation_key: wijk_rebench_2025
    relation: supports
    version_url: https://raw.githubusercontent.com/mlresearch/v267/main/assets/wijk25a/wijk25a.pdf
    locator: 'Final ICML 2025 proceedings: Figure 2 printed p. 3; §§ 3.2–3.3 pp. 5–6; Appendix A.1 p. 14; A.2
      pp. 15–16'
    finding: Final paper confirms best-of-k resampling and human 32-hour result as best of four 8-hour attempts.
      Human participants could use LLMs and other tools; agents and expert workflows are compared under wall-clock
      budgets, not a no-AI human counterfactual.
    review_basis: this_run_primary
    checked_scope: Selected exact final PDF methods/results/appendix passages and Figure 2 visual check; not
      all 61 pages or experimental reproduction.
    review_event_ids:
    - r2_claimchecks_01
    - r2_claimchecks_02
  - citation_key: folkerts_measuringaiagentscyber_2026
    relation: bounds
    version_url: https://arxiv.org/pdf/2603.11214v3
    locator: v3 Table 1; Appendix E Table 2; § 3.2
    finding: Higher budgets improve some tested models, but 10M-token results are not monotonically ordered
      by model release. One inherited recomputation reports 9.6 versus the paper's 9.8 for one appendix-derived
      cell.
    review_basis: supplied_ledger
    checked_scope: 'Inherited full text description: All 30 PDF pages of v3: §§ 1–6, references, Appendices
      A–E, rendered Figures 1–7, and programmatic verification of all 24 end-to-end summary cells from 1,263
      parsed appendix run rows.; not independently repeated in this integration.'
  limitation: RE-Bench’s32-hour point aggregates attempts rather than one continuous32-hour run. The exact
    final proceedings PDF has now been retrieved and its relevant methods checked, but remaining appendices/run-level
    data were not fully reviewed. Experts could use LLMs/tools; human-source heterogeneity and best-observed
    allocation matter. Folkerts’ single-cell discrepancy remains a separate lead.
  counterevidence: The benchmarks show useful task performance, budget sensitivity and some agent strengths.
    RE-Bench also notes that lower agent cost and different workflows could make agents economically competitive
    despite a longer-time score disadvantage; time-matched results do not settle economic automation or causal
    AI assistance.
  next_check: Use final-publication locators and aggregate-attempt/comparator qualifications. Omit broad long-horizon/no-AI
    uplift extrapolations. Complete run-level reproduction or other appendices only if needed by a leading
    claim; separately resolve or omit the Folkerts cell.
- id: C04
  section: evaluation_configuration
  claim: Unlearning evaluations can establish reduced performance on specified probes while leaving format
    sensitivity, retained knowledge and utility tradeoffs open.
  status: provisional
  evidence:
  - citation_key: li_wmdpbenchmarkmeasuring_2024
    relation: supports
    version_url: https://proceedings.mlr.press/v235/li24bc.html
    locator: PMLR proceedings abstract; separately inspected arXiv v7 setup, mitigation and limitations (version
      equivalence not established)
    finding: WMDP supplies hazardous-knowledge proxy questions and reports reduced measured performance under
      RMU.
    review_basis: supplied_ledger
    checked_scope: 'Inherited selected sections description: PMLR abstract/metadata and arXiv v7 setup, mitigation
      and limitations excerpts; not independently repeated in this integration.'
  - citation_key: joshi_robustevaluationunlearning_2024
    relation: bounds
    version_url: https://arxiv.org/html/2411.15477v1
    locator: v1 methods; full results tables; Appendices A–E
    finding: On synthetic TOFU author facts, query transformations change measured forgetting and retention.
      Comprehension with answers supplied in context tests generation suppression.
    review_basis: supplied_ledger
    checked_scope: 'Inherited full text description: Version 1 full substantive text and appendices A–E, including
      transformation procedures, metrics, prompt examples, qualitative examples and both full result tables.;
      not independently repeated in this integration.'
  - citation_key: liu_rethinkingmachineunlearnin_2024
    relation: contextualizes
    version_url: https://doi.org/10.1038/s42256-025-00985-0
    locator: arXiv v6 conceptual opening; Nature Machine Intelligence metadata
    finding: The review distinguishes unlearning goals, leakage and collateral effects.
    review_basis: supplied_ledger
    checked_scope: 'Inherited selected sections description: arXiv v6 abstract/conceptual opening and Nature
      publisher metadata; not independently repeated in this integration.'
  limitation: Hazardous multiple-choice knowledge and synthetic facts differ from operational harmful capability
    or verified deletion. Metrics and base-model controls must remain matched.
  counterevidence: Lower probe scores are a measured result; changed-prompt recovery and retention losses constrain
    the interpretation rather than erase that result.
  next_check: Complete the final-version methods and compare each probe with its own base/fine-tuned controls
    before inferring operational risk reduction or permanent erasure. The related Hayes preprint in C35 adds
    per-example and retained-data privacy outcomes; it does not authenticate the final SaTML edition.
- id: C05
  section: safeguards
  claim: Many-shot defenses show both improvements and residual scaling/utility limits under different training
    and evaluation conditions.
  status: provisional
  evidence:
  - citation_key: anil_manyshotjailbreaking_2024
    relation: supports
    version_url: https://proceedings.neurips.cc/paper_files/paper/2024/file/ea456e232efb72d261715e33ce25f208-Paper-Conference.pdf
    locator: NeurIPS 2024 §§5.1–5.4; Figure 5
    finding: Several general/targeted fine-tuning approaches mainly reduced the baseline while leaving success
      growth with additional shots.
    review_basis: supplied_ledger
    checked_scope: 'Inherited selected sections description: NeurIPS PDF opening design and sections 5.1–5.4
      mitigation excerpts, including Figure 5 and slope/intercept results; not independently repeated in this
      integration.'
  - citation_key: ackerman_mitigatingmanyshot_2025
    relation: supports
    version_url: https://arxiv.org/html/2504.09604v3
    locator: v3 §§2.1,3.1/Table 1,3.2,4.2
    finding: On Llama 3.1 8B, adversarial fine-tuning with sanitization examples and input sanitization flattened
      slopes in several tested settings, with some benign long-dialogue preferences favoring untuned answers.
    review_basis: prior_audit
    checked_scope: Prior audit checked selected primary sections on the single-model test, reported 8192 context
      and utility tradeoffs; not independently repeated here.
  limitation: Models, examples, controls and tested context lengths differ. The reported 8192 context is a
    test limit, not an independently certified architectural maximum.
  counterevidence: Ackerman's flatter slopes bound any claim that fine-tuning can only shift intercepts; Anil's
    residual scaling bounds broad robustness claims.
  next_check: Compare matched attack, model, training-data and benign-utility conditions before explaining
    the difference or extrapolating to longer contexts.
