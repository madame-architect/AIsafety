    schema excerpts and categorical fields were checked; underlying case narratives/assessments were not comprehensively
    read or independently verified. Strict cp1252 v2 bytes preserved via byte-identical base64 API representation.
  counterevidence: The inventory is a concrete disclosure artifact beyond a future commitment. Its structured
    fields can guide audit, but publication alone is neither safety evidence nor proof that control duties
    were executed.
  next_check: Use explicit snapshot/file/hash/normalization when quoting totals. Review full schema-to-v2 mapping
    and primary agency evidence before deriving compliance or outcome rates.
- id: C63
  section: policy_implementation
  claim: The 2025 Foundation Model Transparency Index measures disclosed information for 13 developers across
    100 indicators. Its reported mean of 40.69/100 describes disclosure, rather than verified control effectiveness
    or a controlled annual change in safety.
  status: scoped_check
  evidence:
  - citation_key: wan_foundationmodeltransparency_2025
    relation: supports
    version_url: https://arxiv.org/pdf/2512.10169v1
    locator: v1§§3.3–4.5 pp. 14–18; Figure 7 p. 19; Figure 15/§5.3 pp. 32–36; AppendixA pp. 48–49
    finding: Methods combine seven solicited reports and six FMTI-prepared issuer-source reports, two FMTI
      scorers per 1,300 pairs and company responses. The mean is 529/13=40.69; changed indicators/reporting/flagship
      models bound annual comparisons. Non-disclosure is not absence of practice.
    review_basis: this_run_primary
    checked_scope: 'Exact arXiv v1 PDF pp. 1,3–6,14–19,32–39,48–49: abstract, index/instrument background and
      changes, full §§4.1–4.5 methods, overall results/Figure 7, reporting-method comparison, longitudinal
      discussion/Figures 16–17/Table 3, conclusion/conflicts, and AppendixA including agent prompt and retrieval
      comparison. Other results subsections, indicator tables and bibliography pages not fully read.'
    review_event_ids:
    - r3_provider_01
  limitation: Selected source reading; no independent re-scoring or underlying developer-source audit. The
    scores are investigator judgments about issuer information, not independent observation of controls. Changes
    to the sample, instrument and process complicate trend inference.
  counterevidence: Structured reporting and engagement can produce new public information; some companies score
    highly and some fixed-indicator examples show actual disclosure regressions. These positive and negative
    observations should not be discarded merely because transparency is distinct from realized safety.
  next_check: Audit any publication-leading indicator regression against exact published developer reports.
    Use 40.69/100 with the 13×100 denominator; omit causal safety or controlled-trend interpretations unless
    stronger evidence is supplied.
- id: C64
  section: policy_implementation
  claim: NVIDIA’s report, applicable as of August 2025, describes screening, approval, reassessment and pre-release
    testing mechanisms, including reported Garak use. Its risk-analysis template and issuer descriptions do
    not demonstrate realized risk reduction.
  status: scoped_check
  evidence:
  - citation_key: nvidia_frontierriskassessment_2025
    relation: supports
    version_url: https://images.nvidia.com/content/pdf/NVIDIA-Frontier-AI-Risk-Assessment.pdf
    locator: Coverp. 1; PRA/DRA pp. 2–5; risk formula/Table 1 pp. 6–7; Table 2 p. 8; Garak p. 13; Governance
      pp. 14–15
    finding: Positive reported operational mechanisms coexist with limits on enforcing controls across all
      products. Table 2 is explicitly an example/template, not a measured 49→5 product result. The cover’s
      no-frontier-development statement is historical.
    review_basis: this_run_primary
    checked_scope: All 15 PDF pages, including cover/abstract/executive summary, Preliminary and Detailed Risk
      Assessments, both V-model figures, Tables 1–2, risk mitigation/tool descriptions, risk evaluation and
      governance, and the footnotes printed in this document. Linked tools, model cards and cited studies were
      not independently opened.
    review_event_ids:
    - r3_provider_02
  limitation: Full reading of the 15-page document does not verify tool efficacy, actual deployment decisions
    or applicability to all products. August applicability is established, but the canonical February 17 publication
    date remains unchecked. Table2 is an illustrative template; no observed risk-reduction percentage should
    be inferred.
  counterevidence: The report names specific workflows and reports actual pre-release Garak use, so treating
    it as content-free or purely aspirational would erase useful evidence. Conversely internal committees are
    not independent external assurance and downloadable weights limit downstream control.
  next_check: Seek dated product assessments/model cards and review records for a consequential effectiveness
    claim. Retain specific attributed mechanisms and omit template risk-reduction arithmetic now.
- id: C65
  section: policy_implementation
  claim: Meta’s April 7, 2026 v2 framework combines a material-contribution risk trigger with conditional mitigated
    development/deployment and more explicit accountability. The inspected text alone does not establish overall
    strengthening or weakening, adherence, or a safety effect.
  status: scoped_check
  evidence:
  - citation_key: meta_advancedaiscalingframeworkv2_2026
    relation: supports
    version_url: https://ai.meta.com/static-resource/Meta_Advanced-AI-Scaling-Framework-v2/
    locator: §§2–3 pp. 4–17; Table 1 p. 15; §§4.1–4.2 pp. 25–28; §5 p. 40; terminology/change log pp. 41–44
    finding: V 2 conditions deployment of high/critical models on validated mitigation to moderate-or-lower
      risk and specifies responsible officers, reporting/update processes and deployment-sensitive elicitation.
      Its change log describes both changed threshold criteria and response labels; some protocols remain future/developing.
    review_basis: this_run_primary
    checked_scope: 'PDF pp. 1–17,25–28,39–44: executive summary, scope, complete governance/transparency/accountability
      sections, outcomes/threat-model inclusion criteria and risk thresholds, evaluation environment and elicitation/deployment-context
      passages, first cybersecurity threshold example, benefits assessment, future work, terminology and change
      log. Risk-domain scenarios and detailed domain-specific implementation pp. 18–24,29–38 not read in full.'
    review_event_ids:
    - r3_provider_03
  limitation: Selected 44-page source reading; old/new comparison is attributed to v2’s change log, not an
    independently captured v1 comparison. Scope excludes some gradual or remediable serious harms, and no released
    model’s compliance or effectiveness is established.
  counterevidence: Broader threshold criteria and more explicit processes may strengthen a policy, while conditional
    continuation and scope exclusions may reduce restraint in some interpretations. Those effects depend on
    actual risk decisions, mitigations and governance, not tier labels alone.
  next_check: If overall policy direction leads the publication, compare exact v1 bytes and actual preparedness
    reports/risk decisions. Preserve v2’s conditions now and leave the consequential interpretive judgment
    open.
