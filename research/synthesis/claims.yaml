  counterevidence: Black-box tests can still reveal consequential failures; deeper access adds security and
    capacity burdens and may be unhelpful without time or relevant information. Shared author and citation
    lineage do not supply independent experimental corroboration.
  next_check: Compare concrete evaluation agreements, interfaces, information, time and resources against the
    publication claim being tested. Avoid an unconditional access ranking.
- id: C39
  section: governance
  claim: The accountability value of an audit depends on its institutional design, including scope, auditor
    selection and payment, access and legal protection, professional standards, follow-up and disclosure. Restricted
    public disclosure with fuller regulator access is one proposed pathway, rather than proof that maximum
    public transparency is always best.
  status: provisional
  evidence:
  - citation_key: raji_outsideroversight_2022
    relation: supports
    version_url: https://dho.stanford.edu/wp-content/uploads/Outsider_Oversight.pdf
    locator: §§3–4.5.2 and §5; mainFigure1 printedp561
    finding: The cross-sector review identifies five design dimensions, mixed evidence for some arrangements,
      interactions among them, and a registered-report/limited-disclosure proposal.
    review_basis: this_run_primary
    checked_scope: 'All accessible text of the 15-page published-format PDF, printed pp557–571: §§1–6, references,
      Appendix Tables1–2, plus visual inspection of the main audit matrix and the disputed appendix rows.'
    review_event_ids:
    - r2_institutions_03
  - citation_key: casper_blackboxaccessaudits_2024
    relation: contextualizes
    version_url: https://arxiv.org/pdf/2401.14446v3
    locator: arXiv v3 AppendixD
    finding: The authors identify conflicts, constrained resources, narrow scope, excluded viewpoints and capture
      as failure modes beyond technical access.
    review_basis: this_run_primary
    checked_scope: 'Selected arXiv v3: §2.1 and Table 1 access definitions; portions of §§3–4.1 reviewing access-enabled
      testing; §§5–7 on outside-the-box information, security and discussion; Appendix D in full. Not the complete
      paper or all technical appendices/references.'
    review_event_ids:
    - r2_institutions_02
  limitation: Cross-industry analogies and proposed arrangements do not measure present frontier-AI audit effectiveness.
    Outsider Oversight’s AppendixTable2 appears to swap FDAFAERS and FCCTCB descriptions; those two program
    examples are omitted from this inference pending primary verification.
  counterevidence: Internal audits retain useful access and preventive functions; independence can trade off
    with expertise, and formal licensing or disclosure can produce exclusion, cost or box-ticking. The five
    design dimensions are not validated as a universal scoring formula.
  next_check: For applied cases, record who selected/paid the assessor, what could be tested, who received
    the findings and who acted on them. Verify affected FDA/FCC program descriptions before reuse.
- id: C40
  section: governance
  claim: Legal protection for good-faith research and protection against technical exclusion address different
    barriers to external evaluation. The safe-harbor proposal links them to disclosure rules, independent access
    review and appeals; it does not show that legal language alone supplies access or improves safety.
  status: provisional
  evidence:
  - citation_key: longpre_safeharbor_2024
    relation: supports
    version_url: https://raw.githubusercontent.com/mlresearch/v235/main/assets/longpre24a/longpre24a.pdf
    locator: PMLR 2024 Table1, §4, Figure1 and §§4.1–4.2, PDFpp6–9
    finding: The authors distinguish civil legal protection from account-suspension protections, propose conditional
      researcher and company commitments, and describe third-party review/appeal mechanisms.
    review_basis: this_run_primary
    checked_scope: PMLR published PDF pp1–4 (abstract, introduction, definitions/Table1 and researcher-experience
      discussion/Table2), the sampling-qualification paragraph at the beginning of p5, plus §4, §§4.1–4.2 and
      Figure1 text on PDFpp6–9. Remaining company-policy text/Table3 and later sections/appendices were not
      read in full.
    review_event_ids:
    - r2_institutions_04
  limitation: The paper is a position argument informed by nonrepresentative informal experience. Its 2024
    company/legal snapshot has not been revalidated as current law; company promises do not remove criminal
    liability or create unrestricted research rights.
  counterevidence: Trusted intermediaries and preregistration may narrow participation, preserve company gatekeeping
    or exclude critical groups. Technical exemptions can add misuse and administration costs; this round did
    not measure the proposed trade-offs.
  next_check: Read the implementation appendices and obtain dated operative policy/legal evidence before claiming
    current protection, participation change or safety effects.
- id: C41
  section: governance
  claim: Internal lifecycle audits and external scrutiny can play complementary roles. Internal access and
    documentary records can support prospective testing, remediation and deployment decisions, while external
    challenge can test organizational priorities and omissions; neither role is validated merely by producing
    an audit report.
  status: provisional
  evidence:
  - citation_key: raji_closingaccountabilitygap_2020
    relation: supports
    version_url: https://arxiv.org/pdf/2001.00973v1
    locator: v1 §2.4, §§4.1–4.6, Figures1–2 and §5
    finding: The proposed SMACTR workflow connects development-stage artifacts and testing to reflection and
      post-audit action, while acknowledging internal organizational interests and wider checks and balances.
    review_basis: this_run_primary
    checked_scope: 'All accessible text of the 12-page arXiv v1 PDF: §§1–6, references and both hypothetical
      CompanyX examples. Figures1–2 were also rendered and visually inspected. Linked supplementary worked
      templates were not retrieved/read.'
    review_event_ids:
    - r2_institutions_05
  - citation_key: raji_outsideroversight_2022
    relation: contextualizes
    version_url: https://dho.stanford.edu/wp-content/uploads/Outsider_Oversight.pdf
    locator: §5 Limitations; §§4.2–4.5
    finding: The authors explicitly preserve the value of internal audits and argue against relying on them
      alone; design arrangements shape whether external review adds accountability.
    review_basis: this_run_primary
    checked_scope: 'All accessible text of the 15-page published-format PDF, printed pp557–571: §§1–6, references,
      Appendix Tables1–2, plus visual inspection of the main audit matrix and the disputed appendix rows.'
    review_event_ids:
    - r2_institutions_03
  limitation: SMACTR’s two CompanyX cases are hypothetical, not an implementation or harm-reduction study.
    The sources share an author and scholarly lineage; they are complementary arguments rather than independent
    outcome replications.
  counterevidence: Internal processes can miss affected populations or translate company principles into self-serving
    criteria; external reviewers can lack data, resources or practical leverage. Lifecycle documentation can
    become box-ticking if no one owns mitigation and follow-up.
  next_check: Look for actual audit records, affected-stakeholder participation, decision authority, completed
    mitigation and response to external challenge before claiming effectiveness.
- id: C43
  section: evaluation_configuration
  claim: Cost-controlled agent comparisons can both overturn apparent architecture gains and improve usable
    designs; the relevant comparison depends on whether the decision concerns model science or downstream use.
  status: scoped_check
  evidence:
  - citation_key: kapoor_aiagentsmatter_2024
    relation: supports
    version_url: https://arxiv.org/pdf/2407.01502v1
    locator: arXiv v1 §§2–4 pp3–7; TablesA1/A3 pp20/23; AppendixA–B pp18–26
    finding: Simple HumanEval retry/warming baselines lie on or improve the cost–accuracy frontier relative
      to selected complex architectures; HotPotQA joint optimization lowers variable cost with similar retrieval
      performance.
    review_basis: this_run_primary
    checked_scope: Complete main text §§1–7, PDF pp1–11; complete AppendixA–B text/tables/captions pp18–26
      plus AppendixC/D opening/selection and NovelQA setup onp26. References pp12–17 and remaining AppendicesC–I/NeurIPS
      checklist pp27–33 were not read completely; image-only plot values were not digitized. Selected33-page
      preprint, not a full read. Experiments are the authors' own reproduced/re-evaluated runs in historical2024
      model/pricing conditions; this review ran no agents. Five-run confidence intervals omit optimization/resampling
      variability, as FigureA5 notes. Holdout appropriateness counts include stated intentions, not only existing
      holdouts. NovelQA comparison was one run and its sequential-cost extrapolation is modeled.
    review_event_ids:
    - r2_sociotechnical_02
  limitation: The paper uses selected historical models/benchmarks, modified HumanEval example tests and dated
    API prices. Its confidence intervals omit optimization/resampling variation; NovelQA was run once. This
    review does not reproduce its experiments.
  counterevidence: Complex planning/reflection may still help on harder tasks. Autonomous-only evaluations
    may also understate utility when humans provide feedback; the latter is a review argument relying in part
    on external studies.
  next_check: Keep cost, token, task, model, retry and human-supervision conditions attached to any comparison;
    complete remaining appendix/run-level checks before numerical publication.
- id: C44
  section: governance
  claim: Dataset documentation can make intended use, sampling, provenance and maintenance inspectable through
    a reflective workflow; automated metadata completion is not equivalent to that proposed process or proof
    of representative data.
  status: scoped_check
  evidence:
  - citation_key: gebru_datasheets_2021
    relation: supports
    version_url: https://arxiv.org/pdf/1803.09010v8
    locator: arXiv v8 §§1.1–4 pp2–11; AppendixA pp14–18
    finding: Datasheets asks factual lifecycle questions, recommends recording unknowns, and explicitly treats
      creator reflection as an objective that should not be automated. It reports development feedback and
      organizational pilots without evaluating causal effects.
    review_basis: this_run_primary
    checked_scope: 'All18 pages of arXivv8 accessible extracted text read in three complete six-page blocks:
      introduction/objectives, development process, all questions/workflow, impact/challenges, acknowledgments/references,
      AppendixA and all four text-based example datasheet figures. External cited datasets/links were not opened.
      Published CACM equivalence not authenticated. Reported organizational pilots are author reports, not
      independently verified adoption or causal evidence of harm reduction. Examples disclose unknowns; full
      text does not include all linked datasets or web resources.'
    review_event_ids:
    - r2_sociotechnical_01
  limitation: Full reading covers the18-page arXivv8 object linked by the canonical record. The CACM layout/bytes
    and linked datasets were not authenticated; reported pilots are author reports rather than verified adoption
    or measured harm reduction.
  counterevidence: Documentation has a plausible and practical communication/selection role and reported uptake,
    even though it cannot anticipate every use or guarantee fairness. Organizational incentives, overhead and
    dynamic-data maintenance constrain implementation.
  next_check: Use disclosure gaps to guide targeted source checks and creator questions; preserve unknowns.
    Inspect the published CACM object separately if citing its exact layout/DOI.
- id: C45
  section: outcomes
  claim: Layered model, red-team and human field testing can expose different application-validity problems
    and user perceptions; the ARIA pilot demonstrates an implemented method, not a calibrated cross-application
    safety ranking or a measured reduction in harms.
  status: scoped_check
  evidence:
  - citation_key: amironesei_aria_pilot_2025
    relation: supports
    version_url: https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.700-2.pdf
    locator: NIST AI700-2 §§2–5, printedpp2–12/viewer9–19; §5.2 and AppendixC
    finding: ARIA combines annotations and tester questionnaires in transparent measurement trees; example
      applications obtain their largest signals from different testing levels, and tester perceptions can diverge
      from annotated violations.
    review_basis: this_run_primary
    checked_scope: Abstract/TOC PDF pp4–5; main text §§1–7 PDF pp8–21 (printed1–14), including testing, annotation,
      crosswalk, CoRIx topology, example interpretations and future work; AppendixC PDFp29/printed22. Other
      appendices and rendered tree graphics not completely reviewed. Exploratory seven-application pilot with51
      red teamers and19 field testers under English scenarios, not representative deployment outcomes. Proxy
      scenarios differ from severe harms; not every application was tested at every level. Questionnaires and
      annotations are not directly comparable, and scores are characterized as better for describing than ranking
      applications. Uncertainty propagation and questionnaire validation remain future work.
    review_event_ids:
    - r2_sociotechnical_03
  limitation: Small English-language pilot of proxy scenarios. Testers, annotators, dialogues and annotation
    judgments have different denominators. The source says initial CoRIx is better for characterization than
    comparison; questionnaire/annotation questions differ and uncertainty quantification remains open. Main267/52
    versus AppendixC267/49 count tension is held rather than turned into a violation rate.
  counterevidence: Field-style use may reveal failures absent in fixed prompts, while model testing may reveal
    issues that field users miss or do not commonly elicit. Neither direction is a general guarantee of ecological
    validity.
  next_check: Retain qualitative findings and omit affected violation numbers pending source clarification.
    Complete measurement and appendix/visual review before any numerical cross-system inference.
- id: C46
  section: evaluation_configuration
  claim: Standardized multi-metric evaluation can produce useful common comparisons and reveal tradeoffs while
    explicitly restricting the measured subspace; broad coverage should remain distinct from deployment validity.
  status: scoped_check
  evidence:
  - citation_key: liang_helm_2023
    relation: supports
    version_url: https://arxiv.org/pdf/2211.09110v2
    locator: arXiv v2 §1; §4.1–4.2/Tables2–4 pp25–27; §4.6–4.8; §10.1–10.5 pp78–80
    finding: HELMv2 operationalizes selected scenarios and metrics under common adaptation, exposes cross-metric
      differences, and makes missing scenario/metric/model coverage explicit. Its seven metrics cover98 of112
      selected scenario–desideratum pairs, with exclusions explained.
    review_basis: this_run_primary
    checked_scope: Title/abstract and §1 overview; selected §1.2 top-level findings pp7–10; selected scenario
      and metric-method text pp23–32, especially §4.1–4.2 Tables2–4 and §4.6–4.8; missing-scenario/metric/model/adaptation
      discussion §10.1–10.5 pp78–80. Not a complete162-page read; full appendices, results figures and live
      raw outputs not audited. Historical30-model comparison. Metric coverage and known omissions are part
      of the result. Fairness perturbations may miss complex distribution differences; demographic group labels
      are missing for many scenarios; bias/toxicity proxies have acknowledged validity limits. No underlying
      prediction matrix or live leaderboard was reproduced. Some PDF diagram text/URLs extract poorly; no graph-coordinate
      verification.
    review_event_ids:
    - r2_sociotechnical_04
  limitation: Selected portions of a162-page historical report, not complete text or raw-output replication.
    Scalable fairness/bias/toxicity proxies have acknowledged limits; many social/system properties require
    access and contextual knowledge outside its evaluation interface.
  counterevidence: Recognition of incompleteness does not erase the constructive value of unified comparison.
    Conversely, adding more metrics does not automatically validate them or produce a single trustworthy-system
    ranking.
  next_check: For a publication-leading numerical result, inspect its exact scenario/metric methods, model
    checkpoint, raw outputs and stakeholder validity rather than reuse overall benchmark coverage as assurance.
- id: C47
  section: evaluator_integrity
  claim: Historical trustworthiness evaluations show both standard-condition improvements and metric/access-specific
    reversals; higher average accuracy alone does not fix fairness or robustness under an altered threat model.
  status: scoped_check
  evidence:
  - citation_key: wang_decodingtrust_2023
    relation: supports
    version_url: https://proceedings.neurips.cc/paper_files/paper/2023/file/63cb9921eecf51bfad27a99b2c53dd6d-Paper-Datasets_and_Benchmarks.pdf
    locator: NeurIPS2023 §§2–9/Tables1–4 pp4–10; mainp2 footnote3; AppendixB.1 PDFp30
    finding: On fixed March2023 GPT checkpoints, benign toxicity and some robustness/OOD outcomes improve,
      while adversarial system/demonstration conditions and constructed fairness base rates expose different
      weaknesses.
    review_basis: this_run_primary
    checked_scope: Main text PDF/printed pp1–2 and4–10; AppendixB preliminaries/model/role setup PDFp30 (appendix
      printedp6). Includes text of Tables1–4 and selected method/result discussions for toxicity, robustness,
      OOD, demonstrations, privacy and fairness. Main Figure1 page3, full108-page appendices and graph values
      are not fully reviewed. Historical March2023 API checkpoints. Researchers can set system and user roles,
      so adversarial-system conditions are a particular access threat model rather than all ordinary deployments.
      Proxy toxic classifiers, prompted stereotype agreement and Adult salary prediction fairness do not estimate
      population harm. Proposed mechanisms attributing vulnerability to instruction following are hypotheses,
      not isolated causal tests. No full appendix or code/data reproduction.
    review_event_ids:
    - r2_sociotechnical_05
  limitation: Selected methods/results and one appendix section from a108-page proceedings object. System-role
    attacker access, proxy toxicity judgments, Adult salary tasks and historical checkpoints constrain transfer.
    No modern-deployment incidence or isolated causal mechanism is established.
  counterevidence: Several standard robustness and OOD results favor GPT-4, so the findings do not establish
    a universal capability-versus-safety tradeoff. Shared datasets across broad suites are dependencies, not
    independent corroboration.
  next_check: Complete relevant appendix/classifier/source-data checks before headline rates; keep model IDs,
    role permissions, sampling and each outcome definition explicit.
