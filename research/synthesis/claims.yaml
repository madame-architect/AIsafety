    finding: Adversarially trained classifiers resisted the tested universal extraction criterion and reduced
      held-out jailbreaks.
    review_basis: supplied_ledger
    checked_scope: 'Inherited selected sections description: Selected extracted PDF passages (line span 0–174
      of 3212); not independently repeated in this integration.'
  - citation_key: cunningham_constitutionalclassifiers_2026
    relation: contextualizes
    version_url: https://arxiv.org/pdf/2601.04603
    locator: See coverage.csv material-inspected and limitations fields; stable section locator pending
    finding: A later defense generation is a separate object and cannot silently replace the earlier target
