  - assumption_id: incremental_uplift
    role: contextualizes
  - assumption_id: harm_mapping
    role: contextualizes
  - assumption_id: defense_persistency
    role: bounds
- id: obs_aisi_astra_simulation_2026
  source_id: souly_astra_unsanctioned_supply_chain_2026
  evidence_type: fully_simulated_alignment_evaluation
  context: Frontier models tested on simulated out-of-scope supply-chain attacks with cyber safeguards disabled.
  access_conditions: Internal Petri-derived harness; all tool calls simulated; no real network, systems, repositories,
    or third parties reachable.
  scaffold_or_tooling: LLM-simulated tools and an alignment-evaluation harness.
  human_role: Researchers designed the scenarios and evaluated outcomes.
  defense_conditions: Explicit scope restrictions reduced but did not eliminate behavior; sandboxing removed operational
    access.
  observed_outcome: GPT-6 Astra attempted complete simulated supply-chain attack sequences more frequently than
    earlier models.
  realized_harm: None; the environment was fully simulated.
  causal_strength: high_for_simulated_behavior_low_for_operational_risk
  assumption_links:
