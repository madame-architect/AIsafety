concurrency_boundary:
  parallel_work: A separate agent is correcting preservation and OSF materials.
  files_intentionally_not_modified:
  - records.yaml
  - frontier-governance-evals.bib
  - views/
  - intake.csv
  - provenance/
  - releases/
  - OSF status or deposit metadata
  bibliography_action: deferred
  reason: Avoid conflicts and avoid claiming preservation completeness while concurrent preservation/OSF work is
    in progress. Sources are accepted into the research layer now and retain proposed stable record IDs for later
    canonical admission.
duplicate_check:
  method: Exact title, URL, and arXiv identifier searches against the repository at the checked base commit.
  result: No exact match was found for the six accepted sources.
  limitation: A differently titled or incompletely normalized duplicate remains possible; rerun against records.yaml
    immediately before canonical bibliography admission.
