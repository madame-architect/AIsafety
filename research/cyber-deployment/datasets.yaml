schema_version: cyber-longitudinal-datasets-v1
project_id: frontier_ai_cyber_governance
purpose: 'Maintain two linked longitudinal datasets: provider cyber-safety commitments over time, and
  empirical evidence bearing on the assumptions that connect evaluation performance to operational cyber
  risk.'
datasets:
- id: commitment_history
  title: Cyber safety commitment history
  authority_files:
  - commitments.yaml
  - evidence.yaml
  generated_view: commitment-history.md
  unit_of_analysis: A scoped provider policy provision observed in a specific document edition.
  longitudinal_key: commitment_id
  observation_key: id
  source_key: snapshot_id
  time_fields:
  - published_on
  - observed_on
  - claimed_application_on
- id: benchmark_to_risk_evidence
  title: Benchmark-to-risk evidence
  authority_files:
  - operational-risk/assumptions.yaml
  - operational-risk/source-admission.yaml
  - operational-risk/risk-evidence.yaml
  - operational-risk/source-captures.yaml
  generated_view: operational-risk/evidence-map.md
  unit_of_analysis: A source-specific observation bearing on one or more stable benchmark-to-risk assumptions.
  longitudinal_key: assumption_id
  observation_key: id
  source_key: source_id
  time_fields:
  - source published_on or version_date
  - admitted_on
  - assessment as_of
linkage:
  authority_file: dataset-links.yaml
  bridge_key: assumption_id
  semantics: Commitment provisions may depend on one or more benchmark-to-risk assumptions. Empirical
    observations support, challenge, bound, contextualize, or leave those assumptions unresolved. A link
    does not establish that an incident caused a policy revision, that a commitment was implemented, or
    that a safeguard was effective.
