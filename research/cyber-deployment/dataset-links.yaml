schema_version: cyber-dataset-links-v1
links:
- id: deepmind_weights_to_capability_access
  commitment_id: deepmind_cyber_ccl_model_weight_security
  commitment_observation_ids:
  - deepmind_cyber_weights_fsf_3_0
  - deepmind_cyber_weights_fsf_3_1
  assumption_id: capability_access
  relationship: policy_depends_on
  rationale: The provision governs model-weight security because the risk pathway
    depends on an actor obtaining usable access to the capability represented by the
    protected weights.
- id: deepmind_weights_to_task_transfer
  commitment_id: deepmind_cyber_ccl_model_weight_security
  commitment_observation_ids:
  - deepmind_cyber_weights_fsf_3_0
  - deepmind_cyber_weights_fsf_3_1
  assumption_id: task_transfer
  relationship: policy_depends_on
  rationale: The cyber capability trigger assumes that evaluated or otherwise assessed
    model assistance transfers to high-impact operational cyber attacks.
- id: deepmind_weights_to_incremental_uplift
  commitment_id: deepmind_cyber_ccl_model_weight_security
  commitment_observation_ids:
  - deepmind_cyber_weights_fsf_3_0
  - deepmind_cyber_weights_fsf_3_1
  assumption_id: incremental_uplift
  relationship: policy_depends_on
  rationale: The trigger explicitly compares expected harm with a baseline without
    generative AI and therefore depends on incremental uplift rather than capability
    in isolation.
- id: deepmind_weights_to_harm_mapping
  commitment_id: deepmind_cyber_ccl_model_weight_security
  commitment_observation_ids:
  - deepmind_cyber_weights_fsf_3_0
  - deepmind_cyber_weights_fsf_3_1
  assumption_id: harm_mapping
  relationship: policy_depends_on
  rationale: The threshold maps model assistance in attacks to additional expected
    harm at severe scale; evidence about technical compromise alone does not complete
    that inference.
- id: deepmind_weights_to_defense_persistence
  commitment_id: deepmind_cyber_ccl_model_weight_security
  commitment_observation_ids:
  - deepmind_cyber_weights_fsf_3_0
  - deepmind_cyber_weights_fsf_3_1
  assumption_id: defense_persistence
  relationship: policy_depends_on
  rationale: The source rationale explicitly weighs automated cyber defense and societal
    adaptation, making persistence of offensive uplift after defense a material qualification.
