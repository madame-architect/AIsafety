name: Validate research corpus
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/build.py --check
      - run: python scripts/build_commitments.py --check
      - run: python research/cyber-deployment/operational-risk/build.py --check
      - run: python scripts/build_cyber_datasets.py --check
      - run: python -m unittest discover -s tests -v
