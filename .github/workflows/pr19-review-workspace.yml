name: PR19 review workspace
on:
  push:
    branches: [cyber-history-bibliography-integration-2026-10-24]
    paths: [.github/workflows/pr19-review-workspace.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package exact checkout
        run: |
          git rev-parse HEAD > /tmp/pr19-head.txt
          git archive --format=tar.gz -o /tmp/pr19-workspace.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: pr19-review-workspace
          path: |
            /tmp/pr19-head.txt
            /tmp/pr19-workspace.tar.gz
          retention-days: 7
