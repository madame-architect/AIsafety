name: Apply localized PR19 review corrections
on:
  push:
    branches: [cyber-history-bibliography-integration-2026-10-24]
    paths: [.github/workflows/pr19-review-export.yml]
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Apply locally tested correction, verify exact tree, and remove this workflow
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, os, subprocess, sys
          from pathlib import Path
          encoded = ''
          payload = gzip.decompress(base64.b64decode(encoded, validate=True))
          if hashlib.sha256(payload).hexdigest() != '0cc28f3253dd7edd5dcd23458984a54869ddb2abf91ce504adac18f375dbe1f4':
              raise SystemExit('Transfer checksum mismatch; no research files changed')
          def run(*args):
              subprocess.run(args, check=True)
          subprocess.run(['git','apply','--check','-'], input=payload, check=True)
          subprocess.run(['git','apply','-'], input=payload, check=True)
          for args in [
              ['scripts/build_commitments.py','--write'],
              ['scripts/build_cyber_datasets.py','--write'],
              ['scripts/build.py','--check'],
              ['scripts/lint_bibliography.py'],
              ['scripts/audit_cyber_bibliography.py'],
              ['scripts/build_commitments.py','--check'],
              ['research/cyber-deployment/operational-risk/build.py','--check'],
              ['scripts/build_cyber_datasets.py','--check'],
              ['-m','unittest','discover','-s','tests','-v'],
          ]:
              run(sys.executable, *args)
          Path('.github/workflows/pr19-review-export.yml').unlink()
          run('git','add','-A')
          run('git','diff','--cached','--check')
          tree = subprocess.check_output(['git','write-tree'], text=True).strip()
          if tree != '2440bbfbaae9e0857641a3ee32bbf44cce8a5d80':
              raise SystemExit('Tree differs from locally tested correction; refusing to publish')
          branch = 'cyber-history-bibliography-integration-2026-10-24'
          run('git','fetch','origin',branch)
          if subprocess.check_output(['git','rev-parse','FETCH_HEAD'], text=True).strip() != os.environ['GITHUB_SHA']:
              raise SystemExit('Branch changed concurrently; refusing to publish')
          run('git','config','user.name','github-actions[bot]')
          run('git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          run('git','commit','-m','Restore prospective Critical safeguards and clarify policy-to-risk link direction')
          run('git','push','origin','HEAD:refs/heads/'+branch)
          print('Published exact tested tree', tree, '; no merge or release performed.')
          PY
