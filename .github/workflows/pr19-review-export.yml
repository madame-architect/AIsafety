name: Apply verified PR19 review corrections
on:
  push:
    branches: [cyber-history-bibliography-integration-2026-10-24]
    paths: [.github/workflows/pr19-review-export.yml]
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Apply reviewed source changes and validate exact resulting tree
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import os
          import shutil
          import subprocess
          import sys
          def run(*args):
              subprocess.run(args, check=True)
          def output(*args):
              return subprocess.check_output(args, text=True).strip()
          inputs = {
              '.pr19-review/apply.py': 'bbb2c47dfe1a7ca6e062512c1cce2cfe4455dc511e3f909f13b2249801c76dd5',
              '.pr19-review/test_cyber_review_corrections.py': '669d88d3b4ad16ec78486cfdda6c83e9f7a88342e4377104e52d7338389a54d9',
          }
          for path, expected in inputs.items():
              if hashlib.sha256(Path(path).read_bytes()).hexdigest() != expected:
                  raise SystemExit('Reviewed input checksum mismatch: ' + path)
          run(sys.executable, '.pr19-review/apply.py')
          generator = Path('scripts/build_cyber_datasets.py')
          text = generator.read_text(encoding='utf-8')
          assert text.count('Its **challenged** assessment') == 1
          generator.write_text(text.replace('Its **challenged** assessment', 'A **challenged** assessment'), encoding='utf-8')
          shutil.move('.pr19-review/test_cyber_review_corrections.py', 'tests/test_cyber_review_corrections.py')
          shutil.rmtree('.pr19-review')
          workflow = Path('.github/workflows/pr19-review-export.yml')
          workflow_bytes = workflow.read_bytes()
          workflow.unlink()
          run(sys.executable, 'scripts/build_commitments.py', '--write')
          run(sys.executable, 'scripts/build_cyber_datasets.py', '--write')
          run('git', 'add', '-A')
          run('git', 'diff', '--cached', '--check')
          tree = output('git', 'write-tree')
          if tree != 'cccd5ded0ee285eab27b3624e5eb6fa7ccb7f22d':
              raise SystemExit('Result differs from locally reviewed tree: ' + tree)
          for args in [
              ['scripts/build.py', '--check'],
              ['scripts/lint_bibliography.py'],
              ['scripts/audit_cyber_bibliography.py'],
              ['scripts/build_commitments.py', '--check'],
              ['research/cyber-deployment/operational-risk/build.py', '--check'],
              ['scripts/build_cyber_datasets.py', '--check'],
              ['-m', 'unittest', 'discover', '-s', 'tests', '-v'],
          ]:
              run(sys.executable, *args)
          print('Verified full reviewed tree ' + tree, flush=True)
          # Leave only this temporary workflow for a connector-authored cleanup
          # commit, so normal final-head CI runs after its removal.
          workflow.write_bytes(workflow_bytes)
          run('git', 'add', '-A')
          branch = 'cyber-history-bibliography-integration-2026-10-24'
          run('git', 'fetch', 'origin', branch)
          if output('git', 'rev-parse', 'FETCH_HEAD') != os.environ['GITHUB_SHA']:
              raise SystemExit('Branch changed concurrently; no commit or push performed')
          run('git', 'config', 'user.name', 'github-actions[bot]')
          run('git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          run('git', 'commit', '-m', 'Correct forecast Critical safeguards and directional assumption links')
          run('git', 'push', 'origin', 'HEAD:refs/heads/' + branch)
          PY
