name: Complete PR19 integration
on:
  push:
    branches: [cyber-history-bibliography-integration-2026-10-24]
    paths: [.github/workflows/pr19-completion.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'madame-architect/AIsafety'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python .pr19-transfer/apply.py
      - uses: actions/upload-artifact@v4
        with:
          name: pr19-verified-inventory
          path: /tmp/pr19-verified-inventory.json
          retention-days: 7
